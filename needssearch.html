<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Describe Your Need - brandname.com</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
            background-color: #ffffff;
            color: #000000;
        }
        .header {
            text-align: center;
            margin-top: 40px;
        }
        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            text-decoration: none; /* Removes underline for the logo */
        }
        .logo svg {
            height: 60px;
            width: 60px;
        }
        .logo-text {
            font-size: 2.5em;
            font-weight: bold;
            color: #4CAF50;
        }
        .logo-small {
            font-size: 0.8em;
            font-weight: normal;
            color: #666666;
        }
        .slogan {
            font-size: 1.2em;
            color: #666666; /* Subtle gray for tagline */
            margin-top: 10px;
        }
        .container {
            text-align: center;
            max-width: 750px;
            width: 100%;
            margin: auto;
            padding: 40px 20px;
            color: #333333;
        }
        .search-box {
            margin-bottom: 20px;
        }
        .search-box input {
            width: 90%;
            max-width: 500px;
            padding: 10px 15px;
            font-size: 1em;
            border: 2px solid #4CAF50;
            border-radius: 6px;
            outline: none;
            transition: box-shadow 0.3s ease;
        }
        .search-box input:focus {
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.5);
        }
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .action-buttons a {
            display: inline-block;
            padding: 14px 24px;
            font-size: 1.2em;
            font-weight: bold;
            color: #ffffff;
            background-color: #4CAF50;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.3s ease;
        }
        .action-buttons a:hover {
            background-color: #388E3C;
        }
        footer {
            background-color: #4CAF50;
            padding: 15px 0;
            text-align: center;
        }
        footer a {
            text-decoration: none;
            color: #ffffff;
            font-weight: bold;
            font-size: 1em;
            margin: 5px 10px; /* Spacing between links */
            transition: color 0.3s ease;
        }
        footer a:hover {
            color: #A5D6A7;
        }
        .fine-print {
            font-size: 0.8em;
            text-align: center;
            color: #666666;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <a href="https://brandname.com/index.html" class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" height="60" width="60">
                <circle cx="50" cy="50" r="45" fill="#4CAF50" />
                <text x="50%" y="55%" font-family="Arial, sans-serif" font-weight="bold" font-size="40" fill="white" text-anchor="middle" alignment-baseline="middle">
                    B
                </text>
            </svg>
            <span class="logo-text">brandname<span class="logo-small">.com</span></span>
        </a>
        <!-- Tagline -->
        <div class="slogan">The Search Network for Brands</div>
    </div>
    <!-- Main Content -->
    <div class="container">
        <div class="search-box">
            <input type="text" value="I'm looking for softdrinks" disabled>
        </div>
        <div class="action-buttons">
            <a href="https://brandname.com/searchbrand.html">Find Brand</a>
            <a href="https://brandname.com/searchresults.html">Describe Your Need</a>
        </div>
    </div>
    <!-- Footer -->
    <footer>
        <div>
            <a href="https://brandname.com/benefits.html">Sign In</a>
            <a href="https://brandname.com/brandbenefits.html">Brands</a>
            <a href="https://brandname.com/privacy.html">Privacy</a>
            <a href="https://brandname.com/terms.html">Terms</a>
        </div>
    </footer>
    <!-- Fine print -->
    <div class="fine-print">
        © 2026 brandname.com. All rights reserved. | United States
    </div>
</body>
</html>
