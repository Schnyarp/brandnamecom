<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Needs Search - I want soft drinks</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
            background-color: #ffffff; /* All white background */
        }
        .header {
            text-align: center;
            margin-top: 40px; /* Pushes the title closer to the top */
        }
        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px; /* Space between icon and text */
        }
        .logo svg {
            height: 60px;
            width: 60px;
        }
        .logo-text {
            font-size: 2.5em;
            font-weight: bold;
            color: #4CAF50; /* Fresh Green */
        }
        .logo-small {
            font-size: 0.8em;
            font-weight: normal;
            color: #666666;
        }
        .slogan {
            font-size: 1.2em;
            color: #666666; /* Subtle gray for slogan */
            margin-top: 10px;
        }
        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
            margin: auto;
            padding: 40px 20px;
        }
        .search-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .search-box input {
            width: 100%;
            padding: 16px;
            font-size: 1em;
            border: 1px solid #cccccc;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .option-buttons {
            display: flex;
            justify-content: space-around;
            width: 100%;
        }
        .option-buttons button {
            flex: 1;
            padding: 14px;
            margin: 0 8px;
            font-size: 1em;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: #ffffff;
            transition: background 0.3s;
        }
        .option-buttons button#describe-need {
            background-color: #388E3C; /* Slightly darker green to indicate use */
        }
        .option-buttons button#describe-need:hover {
            background-color: #2E7031; /* Even darker green hover effect */
        }
        .option-buttons button#find-brand {
            background-color: #4CAF50; /* Fresh Green */
        }
        .option-buttons button#find-brand:hover {
            background-color: #388E3C; /* Darker green hover effect */
        }
        footer {
            background-color: #4CAF50; /* Fresh green footer */
            padding: 15px 0;
            text-align: center;
            display: flex;
            justify-content: space-around;
        }
        footer a {
            text-decoration: none;
            color: #ffffff; /* Footer text in white */
            font-weight: bold;
            font-size: 1em;
            transition: color 0.3s ease;
        }
        footer a:hover {
            color: #A5D6A7; /* Lighter green hover effect */
        }
        .fine-print {
            font-size: 0.8em;
            text-align: center;
            color: #666666; /* Subtle gray for fine print */
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" height="60" width="60">
                <circle cx="50" cy="50" r="45" fill="#4CAF50" />
                <text x="50%" y="55%" font-family="Arial, sans-serif" font-weight="bold" font-size="40" fill="white" text-anchor="middle" alignment-baseline="middle">
                    B
                </text>
            </svg>
            <span class="logo-text">brandname<span class="logo-small">.com</span></span>
        </div>
        <!-- Slogan -->
        <div class="slogan">The Social Network For Brands</div>
    </div>
    <!-- Main Content -->
    <div class="container">
        <div class="search-box">
            <!-- Search bar pre-filled with the user's query -->
            <input type="text" placeholder="Describe your need..." value="I want soft drinks">
            <div class="option-buttons">
                <button id="find-brand" onclick="alert('Searching for brands...')">Find Brand</button>
                <button id="describe-need" onclick="alert('You have described your need for soft drinks.')">Describe Your Need</button>
            </div>
        </div>
    </div>
    <!-- Footer -->
    <footer>
        <a href="signin.html">Sign In</a>
        <a href="brands.html">Brands</a>
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
    </footer>
    <!-- Fine print -->
    <div class="fine-print">
        © 2026 brandname.com. All rights reserved. | United States
    </div>
</body>
</html>
