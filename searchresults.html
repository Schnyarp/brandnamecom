<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soft Drinks Results - I want soft drinks</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
            background-color: #ffffff;
            color: #000000;
        }
        .header {
            text-align: center;
            margin-top: 40px;
        }
        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .logo svg {
            height: 60px;
            width: 60px;
        }
        .logo-text {
            font-size: 2.5em;
            font-weight: bold;
            color: #4CAF50;
        }
        .logo-small {
            font-size: 0.8em;
            font-weight: normal;
            color: #666666;
        }
        .slogan {
            font-size: 1.2em;
            color: #666666; /* Subtle gray for slogan */
            margin-top: 10px;
        }
        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
            margin: auto;
            padding: 20px;
        }
        .brand-results {
            margin-top: 30px;
            width: 100%;
        }
        .brand-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            margin-bottom: 15px;
        }
        .brand-logo {
            width: 60px;
            height: 60px;
            border: 2px solid #4CAF50; /* Fresh green border for the logo */
            border-radius: 50%;
            background-color: #81C784; /* Lighter green background */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2em;
            color: #ffffff;
        }
        .brand-button {
            flex: 1;
            margin: 0 10px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            padding: 12px 20px;
            text-align: center;
            color: #ffffff;
            background-color: #cccccc;
            cursor: default;
        }
        .brand-button:hover {
            background-color: #cccccc; /* Keeps background gray on hover */
        }
        .brand-button.active {
            cursor: pointer;
            background-color: #4CAF50;
            text-decoration: none; /* No underline */
            transition: background-color 0.3s;
        }
        .brand-button.active:hover {
            background-color: #388E3C;
        }
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .action-button {
            font-size: 0.8em; /* Reduced font size for thinner buttons */
            font-weight: bold;
            border: none;
            border-radius: 6px;
            background-color: #cccccc; /* Gray to indicate disabled */
            color: #ffffff;
            padding: 6px 10px; /* Thinner padding for compact design */
            text-align: center;
            cursor: default; /* Makes it static */
        }
        footer {
            background-color: #4CAF50;
            padding: 15px 0;
            text-align: center;
            display: flex;
            justify-content: space-around;
        }
        footer a {
            text-decoration: none;
            color: #ffffff;
            font-weight: bold;
            font-size: 1em;
            transition: color 0.3s ease;
        }
        footer a:hover {
            color: #A5D6A7;
        }
        .fine-print {
            font-size: 0.8em;
            text-align: center;
            color: #666666;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <a href="index.html" class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" height="60" width="60">
                <circle cx="50" cy="50" r="45" fill="#4CAF50" />
                <text x="50%" y="55%" font-family="Arial, sans-serif" font-weight="bold" font-size="40" fill="white" text-anchor="middle" alignment-baseline="middle">
                    B
                </text>
            </svg>
            <span class="logo-text">brandname<span class="logo-small">.com</span></span>
        </a>
        <!-- Slogan -->
        <div class="slogan">The Search Network For Brands</div>
    </div>
    <!-- Main Content -->
    <div class="container">
        <div class="search-box">
            <input type="text" placeholder="Describe your need..." value="I want soft drinks">
        </div>
        <div class="brand-results">
            <!-- Brand 1 -->
            <div class="brand-item">
                <div class="brand-logo">CC</div>
                <div class="brand-button">Cowlic Cola</div>
                <div class="action-buttons">
                    <div class="action-button">Follow</div>
                    <div class="action-button">Order</div>
                </div>
            </div>
            <!-- Brand 2 -->
            <div class="brand-item">
                <div class="brand-logo">CH</div>
                <div class="brand-button">Chunky Cola</div>
                <div class="action-buttons">
                    <div class="action-button">Follow</div>
                    <div class="action-button">Order</div>
                </div>
            </div>
            <!-- Brand 3 -->
            <div class="brand-item">
                <div class="brand-logo">GC</div>
                <a href="brands.html" class="brand-button active">Groovy Cola</a>
                <div class="action-buttons">
                    <div class="action-button">Follow</div>
                    <div class="action-button">Order</div>
                </div>
            </div>
        </div>
    </div>
    <!-- Footer -->
    <footer>
        <a href="benefits.html">Sign In</a>
        <a href="brandbenefits.html">Brands</a>
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
    </footer>
    <!-- Fine print -->
    <div class="fine-print">
        © 2026 brandname.com. All rights reserved. | United States
    </div>
</body>
</html>
