<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groovy Cola - brandname.com</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
            background-color: #ffffff;
            color: #000000;
        }
        .header {
            text-align: center;
            margin-top: 40px;
        }
        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .logo svg {
            height: 60px;
            width: 60px;
        }
        .logo-text {
            font-size: 2.5em;
            font-weight: bold;
            color: #4CAF50;
        }
        .logo-small {
            font-size: 0.8em;
            font-weight: normal;
            color: #666666;
        }
        .main-container {
            max-width: 800px;
            margin: 30px auto;
            text-align: center;
        }
        .brand-logo-container {
            width: 150px;
            height: 150px;
            margin: 0 auto;
            border: 2px solid #4CAF50;
            border-radius: 50%;
            background-color: #81C784;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
            font-weight: bold;
            color: #ffffff;
        }
        .brand-slogan {
            margin-top: 20px;
            font-size: 1.5em;
            font-style: italic;
            color: #4CAF50;
        }
        .brand-description {
            margin-top: 20px;
            font-size: 1.2em;
            color: #666666;
            padding: 0 20px;
        }
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .action-buttons button {
            padding: 12px 20px;
            font-size: 1em;
            border: none;
            border-radius: 6px;
            color: #ffffff;
            background-color: #4CAF50;
            cursor: pointer;
            transition: background 0.3s;
        }
        .action-buttons button:hover {
            background-color: #388E3C; /* Darker green hover */
        }
        footer {
            background-color: #4CAF50;
            padding: 15px 0;
            text-align: center;
            display: flex;
            justify-content: space-around;
        }
        footer a {
            text-decoration: none;
            color: #ffffff;
            font-weight: bold;
            font-size: 1em;
            transition: color 0.3s ease;
        }
        footer a:hover {
            color: #A5D6A7;
        }
        .fine-print {
            font-size: 0.8em;
            text-align: center;
            color: #666666;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <!-- Header with brandname.com logo -->
    <div class="header">
        <div class="logo">
            <!-- SVG Logo -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" height="60" width="60">
                <circle cx="50" cy="50" r="45" fill="#4CAF50" />
                <text x="50%" y="55%" font-family="Arial, sans-serif" font-weight="bold" font-size="40" fill="white" text-anchor="middle" alignment-baseline="middle">
                    B
                </text>
            </svg>
            <!-- Logo Text -->
            <span class="logo-text">brandname<span class="logo-small">.com</span></span>
        </div>
    </div>
    <!-- Main content for Groovy Cola -->
    <div class="main-container">
        <!-- Display space for brand logo -->
        <div class="brand-logo-container">
            Logo
        </div>
        <!-- Display slogan -->
        <div class="brand-slogan">
            "Stay Groovy with Every Sip!"
        </div>
        <!-- Place for brand description -->
        <div class="brand-description">
            Groovy Cola is your refreshing and timeless cola choice. Perfect for parties, sunny afternoons, or just because! Stay cool, stay lively – stay Groovy!
        </div>
        <!-- Action buttons -->
        <div class="action-buttons">
            <button onclick="alert('You are now following Groovy Cola!')">Follow</button>
            <button onclick="alert('Share your thoughts about Groovy Cola!')">Comment</button>
            <button onclick="alert('Order Groovy Cola Coming Soon!')">Order</button>
        </div>
    </div>
    <!-- Footer -->
    <footer>
        <a href="signin.html">Sign In</a>
        <a href="brands.html">Brands</a>
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
    </footer>
    <!-- Fine print -->
    <div class="fine-print">
        © 2026 brandname.com. All rights reserved. | United States
    </div>
</body>
</html>
