<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>brandname.com</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
            background-color: #ffffff; /* All white background */
        }
        .development-note {
            font-size: 0.8em;
            font-style: italic;
            text-align: center;
            color: #666666; /* Keeps it subtle */
            margin: 10px 0;
        }
        .header {
            text-align: center;
            margin-top: 20px; /* Slightly reduced margin due to the development note */
        }
        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px; /* Space between icon and text */
            text-decoration: none; /* Removes underline */
        }
        .logo svg {
            height: 60px;
            width: 60px;
        }
        .logo-text {
            font-size: 2.5em;
            font-weight: bold;
            color: #4CAF50; /* Fresh Green */
        }
        .logo-small {
            font-size: 0.8em;
            font-weight: normal;
            color: #666666;
        }
        .slogan {
            font-size: 1.2em;
            color: #666666; /* Subtle gray for slogan */
            margin-top: 10px;
        }
        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
            margin: auto;
            padding: 40px 20px;
        }
        .search-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .search-box input {
            width: 100%;
            padding: 16px;
            font-size: 1em;
            border: 1px solid #cccccc;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .option-buttons {
            display: flex;
            justify-content: space-around;
            width: 100%;
        }
        .option-buttons button {
            flex: 1;
            padding: 14px;
            margin: 0 8px;
            background-color: #4CAF50; /* Fresh Green */
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
        }
        .option-buttons button:hover {
            background-color: #388E3C; /* Darker green hover effect */
        }
        .option-buttons a {
            text-decoration: none;
            display: block;
            color: white;
        }
        footer {
            background-color: #4CAF50;
            padding: 15px 0;
            text-align: center;
        }
        footer a {
            text-decoration: none;
            color: #ffffff;
            font-weight: bold;
            font-size: 1em;
            margin: 5px 10px; /* Spacing between links */
            transition: color 0.3s ease;
        }
        footer a:hover {
            color: #A5D6A7;
        }
        .text-below-footer {
            text-align: center;
            margin: 20px 0;
        }
        .text-below-footer .fine-print {
            font-size: 0.8em;
            color: #666666; /* Subtle gray for fine print */
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <!-- Development Note at the Top of the Page -->
    <div class="development-note">
        This is a mockup site in development. We welcome users to watch and engage as we unfold!
    </div>
    <!-- Header -->
    <div class="header">
        <a href="index.html" class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" height="60" width="60">
                <circle cx="50" cy="50" r="45" fill="#4CAF50" />
                <text x="50%" y="55%" font-family="Arial, sans-serif" font-weight: bold" font-size="40" fill="white" text-anchor="middle" alignment-baseline="middle">
                    B
                </text>
            </svg>
            <span class="logo-text">brandname<span class="logo-small">.com</span></span>
        </a>
        <!-- Slogan -->
        <div class="slogan">The Social Network For Brands</div>
    </div>
    <!-- Main Content -->
    <div class="container">
        <div class="search-box">
            <input type="text" placeholder="Search here...">
            <div class="option-buttons">
                <button><a href="searchbrand.html">Find Brand</a></button>
                <button><a href="needssearch.html">Describe Your Need</a></button>
            </div>
        </div>
    </div>
    <!-- Footer -->
    <footer>
        <div>
            <a href="benefits.html">Sign In</a>
            <a href="brandbenefits.html">Brands</a>
            <a href="privacy.html">Privacy</a>
            <a href="terms.html">Terms</a>
        </div>
    </footer>
    <!-- Fine Print Below Footer -->
    <div class="text-below-footer">
        <div class="fine-print">
            © 2026 brandname.com. All rights reserved. | United States
        </div>
    </div>
</body>
</html>
